<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hinata Sborks</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d0e12;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h1 { 
            font-size: 26px; 
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(270deg, #ffffff, #666a73, #ffffff);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 6s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .card {
            background: rgba(30, 32, 38, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(270deg, rgba(255,255,255,0.2), rgba(255,255,255,0.02), rgba(255,255,255,0.2));
            background-size: 400% 400%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: gradientMove 6s ease infinite;
        }
        .card img {
            width: 100%;
            border-radius: 10px;
            max-height: 180px;
            object-fit: cover;
            filter: grayscale(30%);
        }
        .card h3 {
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
            margin: 15px 0 8px;
        }
        .card p {
            font-size: 13px;
            color: #a0a5b0;
            line-height: 1.4;
        }
              .btn {
            display: block;
            background: linear-gradient(270deg, #ffffff, #989da6, #ffffff);
            background-size: 400% 400%;
            color: #000000;
            padding: 14px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            border: none;
            cursor: pointer;
            font-size: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            animation: gradientMove 6s ease infinite;
            transition: transform 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <h1>Hinata Sborks</h1>
    <p style="color: #6c727f; margin-bottom: 25px;">Выбирай лучшую сборку и скачивай в один клик</p>

    <div class="card">
        <h3>❄️ Зимняя Сборка (FPS UP)</h3>
        <img src="https://placeholder.com" alt="Скриншот">
        <p>Красивые матовые текстуры снега, заменённые машины и сильный прирост FPS для слабых телефонов.</p>
        <button class="btn" onclick="downloadMod('winter_mod')">Скачать</button>
    </div>

    <div class="card">
        <h3>🔥 Летний Вайб (Графика)</h3>
        <img src="https://placeholder.com" alt="Скриншот">
        <p>Яркие сочные цвета, реалистичное небо и новые качественные звуки оружия/авто.</p>
        <button class="btn" onclick="downloadMod('summer_mod')">Скачать</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function downloadMod(modId) {
            window.location.href = "https://t.me" + modId;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hinata Sborks</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #060709;
            color: #ffffff;
            margin: 0;
            padding: 0;
            padding-bottom: 90px;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        #loading-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #060709;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.4s ease;
        }
        .welcome-text {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #ffffff;
            text-shadow: 0 0 12px rgba(255,255,255,0.5);
            margin-bottom: 20px;
        }
        .progress-container {
            width: 50%;
            height: 3px;
            background: #14161d;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: #ffffff;
            box-shadow: 0 0 8px #ffffff;
            border-radius: 10px;
            animation: load 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        @keyframes load {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .header-container {
            padding: 20px 15px 10px;
            display: flex;
            justify-content: flex-start;
        }
        .logo-text {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        }
        .tab-content { display: none; padding: 0 15px; }
        .tab-content.active { display: block; }
        .card {
            background: rgba(20, 22, 28, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 24px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        }
        .media-container {
            position: relative;
            width: 100%;
            border-radius: 18px;
            overflow: hidden;
        }
        .card img {
            width: 100%;
            display: block;
            border-radius: 18px;
            transition: transform 0.3s ease;
        }
        .card:hover img {
            transform: scale(1.02);
        }
        .tags-row {
            display: flex;
            gap: 6px;
            margin-top: 12px;
            margin-bottom: 8px;
        }
        .tag-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .tag-blue { background: rgba(0, 149, 255, 0.15); color: #0095ff; border: 1px solid rgba(0, 149, 255, 0.2); }
        .tag-purple { background: rgba(162, 0, 255, 0.15); color: #a200ff; border: 1px solid rgba(162, 0, 255, 0.2); }
        .tag-new { background: rgba(255, 255, 255, 0.1); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.2); }
        .card h3 { font-size: 19px; color: #ffffff; margin: 8px 0 6px; font-weight: 700; }
        .card p { font-size: 13px; color: #8e929a; margin: 0 0 16px; line-height: 1.4; }
        .btn-video {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            padding: 10px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s;
        }
        .btn-video:active { background: rgba(255, 255, 255, 0.15); }
        .btn-download {
            background: #ffffff;
            color: #060709;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.5px;
            transition: background 0.2s;
        }
        .btn-download:active { background: #cccccc; }
               .profile-container {
            background: radial-gradient(circle at top, #141720 0%, #0c0d12 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 28px;
            padding: 30px 20px;
            text-align: center;
        }
        .profile-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255,255,255,0.03);
            margin: 0 auto 15px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .profile-name { font-size: 24px; font-weight: 800; color: #ffffff; }
        .profile-tag { color: #5a5e66; font-size: 14px; margin-bottom: 25px; }
        .user-stats-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }
        .user-stat-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.02);
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.02);
        }
        .stat-title { font-size: 13px; color: #8e929a; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;}
        .stat-counter { font-size: 18px; font-weight: 700; color: #ffffff; }
        .nav-bar {
            position: fixed;
            bottom: 15px; left: 15px; right: 15px;
            height: 68px;
            background: rgba(10, 11, 14, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 8px;
            z-index: 999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .nav-item {
            color: #5a5e66;
            background: none;
            border: none;
            flex: 1;
            height: 52px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .nav-item.active {
            color: #ffffff;
            background: #121318;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="welcome-text">Welcome!</div>
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <div class="header-container">
        <div class="logo-text">Hinata Sborks</div>
    </div>

    <div id="tab-catalog" class="tab-content active">
        <div class="card">
            <div class="media-container">
                <img src="https://placeholder.com" alt="Превью">
            </div>
            
            <div class="tags-row">
                <span class="tag-badge tag-blue">Полусборка</span>
                <span class="tag-badge tag-new">NEW</span>
            </div>

            <h3>ORANGE FANTA ASSEMBLY</h3>
            <p>Небо, прозрачные капты, кастомный дигл, новые скины бомжихи, замена крови и сильный FPS UP для каптов.</p>
            
            <a href="https://youtube.com" target="_blank" style="text-decoration: none;">
                <button class="btn-video">▶️ Смотреть видеообзор</button>
            </a>
            
            <button class="btn-download" onclick="downloadMod('orange_fanta')">Скачать сборку</button>
        </div>
    </div>

    <div id="tab-profile" class="tab-content">
        <div class="profile-container">
            <div class="profile-avatar" id="user-avatar">👤</div>
            <div class="profile-name" id="user-name">Игрок</div>
            <div class="profile-tag" id="user-tag">@username</div>
            
            <div class="user-stats-list">
                <div class="user-stat-row">
                    <span class="stat-title">Оценка сборок</span>
                    <span class="stat-counter">0 ❤️</span>
                </div>
                <div class="user-stat-row">
                    <span class="stat-title">Успешных загрузок</span>
                    <span class="stat-counter" id="stat-downloads">0 📥</span>
                </div>
                <div class="user-stat-row">
                    <span class="stat-title">Доступно модов</span>
                    <span class="stat-counter">1 📁</span>
                </div>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-item active" id="btn-catalog" onclick="switchTab('catalog', this)">📁 Каталог</button>
        <button class="nav-item" id="btn-profile" onclick="switchTab('profile', this)">👤 Профиль</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('loading-screen');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 400);
            }, 1500);
        });

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = user.first_name || "Игрок";
            document.getElementById('user-tag').innerText = user.username ? '@' + user.username : 'Скрыт';
            if(user.first_name) {
                document.getElementById('user-avatar').innerText = user.first_name.charAt(0);
            }
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            element.classList.add('active');
        }

        function downloadMod(modId) {
            window.location.href = "https://t.me/hinata_sborks_bot" + modId;
        }
    </script>
</body>
</html>

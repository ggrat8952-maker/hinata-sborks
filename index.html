<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hinata Sborks</title>
    <script src="https://telegram.org"></script>
    <style>
        body { font-family: sans-serif; background-color: #0b0616; color: #fff; margin: 0; padding: 15px; padding-bottom: 80px; }
        .header { text-align: center; font-size: 20px; font-weight: bold; color: #b172ff; padding: 15px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .profile-card { background: #120a22; border: 1px solid #3d2563; border-radius: 20px; padding: 20px; text-align: center; }
        .avatar { width: 70px; height: 70px; border-radius: 50%; background: #3d2563; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
        .username { font-size: 20px; font-weight: bold; }
        .tag { color: #8a8a8a; font-size: 14px; margin-bottom: 15px; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .stat-box { background: #1c1232; padding: 10px; border-radius: 10px; }
        .stat-val { font-size: 16px; font-weight: bold; color: #b172ff; }
        .stat-lbl { font-size: 10px; color: #8a8a8a; }
        .card { background: #130b24; border: 1px solid #2d1b4a; border-radius: 15px; padding: 15px; margin-top: 15px; }
        .card img { width: 100%; border-radius: 10px; }
        .btn-download { background: #b172ff; color: #000; border: none; width: 100%; padding: 12px; border-radius: 10px; font-weight: bold; margin-top: 10px; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background: #0f081d; border-top: 1px solid #2d1b4a; display: flex; }
        .nav-item { color: #8a8a8a; background: none; border: none; flex: 1; font-size: 12px; }
        .nav-item.active { color: #b172ff; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">Hinata Sborks</div>

    <div id="tab-profile" class="tab-content active">
        <div class="profile-card">
            <div class="avatar" id="user-avatar">👤</div>
            <div class="username" id="user-name">Игрок</div>
            <div class="tag" id="user-tag">@username</div>
            <div class="stats-grid">
                <div class="stat-box"><div class="stat-val">0</div><div class="stat-lbl">ЛАЙКОВ</div></div>
                <div class="stat-box"><div class="stat-val">0</div><div class="stat-lbl">СКАЧАНО</div></div>
                <div class="stat-box"><div class="stat-val">1</div><div class="stat-lbl">СБОРОК</div></div>
            </div>
        </div>
    </div>

    <div id="tab-catalog" class="tab-content">
        <div class="card">
            <img src="https://placeholder.com" alt="Превью">
            <h3>ORANGE FANTA ASSEMBLY</h3>
            <p>FPS UP, прозрачные капты, кастомный дигл и новые звуки.</p>
            <button class="btn-download" onclick="downloadMod('orange_fanta')">Скачать</button>
        </div>
    </div>

    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('profile', this)">👤 Профиль</button>
        <button class="nav-item" onclick="switchTab('catalog', this)">📁 Каталог</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = user.first_name || "Игрок";
            document.getElementById('user-tag').innerText = user.username ? '@' + user.username : 'Скрыт';
            if(user.first_name) {
                document.getElementById('user-avatar').innerText = user.first_name.charAt(0);
            }
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');
            element.classList.add('active');
        }

        function downloadMod(modId) {
            window.location.href = "https://t.me/hinata_sborks_bot" + modId;
        }
    </script>
</body>
</html>

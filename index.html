<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hinata Sborks</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            padding-bottom: 90px;
            text-align: center;
        }
        h1 { 
            font-size: 26px; 
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 2px;
            margin-top: 20px;
            color: #ffffff;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .card, .profile-card {
            background: #111111;
            border: 1px solid #222222;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .card img {
            width: 100%;
            border-radius: 10px;
            max-height: 180px;
            object-fit: cover;
        }
        .card h3 {
            margin: 15px 0 8px;
            color: #ffffff;
        }
        .card p {
            font-size: 13px;
            color: #aaaaaa;
            line-height: 1.4;
        }
        .stats-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-top: 15px;
            padding: 10px 0;
            background: #1a1a1a;
            border-radius: 10px;
        }
        .stat-item {
            font-size: 13px;
            color: #cccccc;
        }
              .like-btn {
            background: none;
            border: 1px solid #444444;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
        .like-btn.liked {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
        .btn {
            display: block;
            background: #ffffff;
            color: #000000;
            padding: 14px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            border: none;
            font-size: 15px;
            text-transform: uppercase;
            width: 100%;
            box-sizing: border-box;
        }
        .nav-bar {
            position: fixed;
            bottom: 15px; left: 15px; right: 15px;
            height: 65px;
            background: #111111;
            border-radius: 16px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border: 1px solid #222222;
        }
        .nav-item {
            color: #888888;
            background: none;
            border: 1px solid transparent;
            flex: 1;
            height: 45px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 12px;
            margin: 0 5px;
            cursor: pointer;
        }
        .nav-item.active {
            color: #ffffff;
            background: #000000;
            border-color: #ffffff;
        }
    </style>
</head>
<body>

    <h1>Hinata Sborks</h1>

    <!-- ОКНО КАТАЛОГА -->
    <div id="tab-catalog" class="tab-content active">
        <p style="color: #666666; font-size: 14px;">Выбирай лучшую сборку из каталога</p>
        
        <div class="card">
            <h3>❄️ Зимняя Сборка (FPS UP)</h3>
            <img src="https://placeholder.com" alt="Скриншот">
            <p>Красивые текстуры снега, заменённые машины и сильный прирост FPS для слабых телефонов.</p>
            <div class="stats-row">
                <div class="stat-item">📥 1,240 скачиваний</div>
                <button class="like-btn" onclick="toggleLike(this, 'like1')">❤️ <span id="like1">142</span></button>
            </div>
            <button class="btn" onclick="downloadMod('winter_mod')">Скачать</button>
        </div>
    </div>

    <!-- ОКНО ПРОФИЛЯ -->
    <div id="tab-profile" class="tab-content">
        <p style="color: #666666; font-size: 14px;">Твой личный кабинет игрока</p>
        
        <div class="profile-card">
            <h2 style="margin: 0 0 10px 0;">👤 Мой Профиль</h2>
            <p style="font-size: 16px; color: #ffffff; margin: 5px 0;">Статус: Активен</p>
            <p style="font-size: 14px; color: #888888; margin-bottom: 20px;">Роль: Игрок Hinata Sborks</p>
            <div class="stats-row">
                <div class="stat-item">❤️ Поставлено лайков: <span id="total-likes">0</span></div>
            </div>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="nav-bar">
        <button class="nav-item active" id="btn-catalog" onclick="switchTab('catalog', this)">📁 Каталог</button>
        <button class="nav-item" id="btn-profile" onclick="switchTab('profile', this)">👤 Профиль</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            element.classList.add('active');
        }

        function toggleLike(button, countId) {
            const countElem = document.getElementById(countId);
            const totalLikesElem = document.getElementById('total-likes');
            let currentLikes = parseInt(countElem.innerText);
            let totalLikes = parseInt(totalLikesElem.innerText);
            
            if (button.classList.contains('liked')) {
                button.classList.remove('liked');
                countElem.innerText = currentLikes - 1;
                totalLikesElem.innerText = totalLikes - 1;
            } else {
                button.classList.add('liked');
                countElem.innerText = currentLikes + 1;
                totalLikesElem.innerText = totalLikes + 1;
            }
        }

        function downloadMod(modId) {
            window.location.href = "https://t.me" + modId;
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hinata Sborks</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: #0b0616;
            color: #fff;
            margin: 0;
            padding: 0;
            padding-bottom: 80px;
        }
        .header {
            padding: 20px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: #b172ff;
        }
        .tab-content { display: none; padding: 15px; }
        .tab-content.active { display: block; }
        
        .profile-card {
            background: linear-gradient(145deg, #180f2b, #120a22);
            border: 1px solid #3d2563;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }
        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #3d2563;
            margin: 0 auto 15px;
            border: 3px solid #b172ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #fff;
        }
        .username { font-size: 22px; font-weight: bold; margin-bottom: 5px; }
        .tag { color: #8a8a8a; font-size: 14px; margin-bottom: 15px; }
        .badge {
            background: #3d2563;
            color: #cca3ff;
            padding: 5px 15px;
            border-radius: 12px;
            font-size: 12px;
            text-transform: uppercase;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 25px;
        }
        .stat-box {
            background: #1c1232;
            padding: 12px;
            border-radius: 15px;
            border: 1px solid #2d1b4a;
        }
        .stat-val { font-size: 18px; font-weight: bold; color: #b172ff; }
        .stat-lbl { font-size: 11px; color: #8a8a8a; margin-top: 4px; }

        .card {
            background: #130b24;
            border: 1px solid #2d1b4a;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .card img { width: 100%; border-radius: 10px; }
        .card h3 { color: #cca3ff; margin: 10px 0 5px; }
        .card p { font-size: 13px; color: #aaa; margin: 0 0 15px; }
        .btn-download {
            background: #b172ff;
            color: #000;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
        }

        .nav-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 65px;
            background: #0f081d;
            border-top: 1px solid #2d1b4a;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .nav-item {
            color: #8a8a8a;
            text-align: center;
            font-size: 12px;
            text-decoration: none;
            background: none; border: none;
            flex: 1;
        }
        .nav-item.active { color: #b172ff; font-weight: bold; }
        .nav-icon { font-size: 20px; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="header">Hinata Sborks</div>

    <!-- ВКЛАДКА: ПРОФИЛЬ -->
    <div id="tab-profile" class="tab-content active">
        <div class="profile-card">
            <div class="avatar" id="user-avatar">👤</div>
            <div class="username" id="user-name">Загрузка...</div>
            <div class="tag" id="user-tag">@username</div>
            <span class="badge">Пользователь</span>
            
            <div class="stats-grid">
                <div class="stat-box"><div class="stat-val">0</div><div class="stat-lbl">ЛАЙКОВ</div></div>
                <div class="stat-box"><div class="stat-val" id="stat-downloads">0</div><div class="stat-lbl">СКАЧИВАНИЙ</div></div>
                <div class="stat-box"><div class="stat-val">1</div><div class="stat-lbl">СБОРОК</div></div>
            </div>
        </div>
    </div>

    <!-- ВКЛАДКА: КАТАЛОГ -->
    <div id="tab-catalog" class="tab-content">
        <div class="card">
            <img src="https://placeholder.com" alt="Превью">
            <h3>ORANGE FANTA ASSEMBLY</h3>
            <p>Небо, прозрачные капты, лого, замена скинов, кастомный дигл, звуки выстрела и FPS UP.</p>
            <button class="btn-download" onclick="downloadMod('orange_fanta')">Скачать</button>
        </div>
    </div>

    <!-- Нижнее Меню -->
    <div class="nav-bar">
        <button class="nav-item active" onclick="switchTab('profile', this)">
            <span class="nav-icon">👤</span>Профиль
        </button>
        <button class="nav-item" onclick="switchTab('catalog', this)">
            <span class="nav-icon">📁</span>Каталог
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = user.first_name || "Игрок";
            document.getElementById('user-tag').innerText = user.username ? '@' + user.username : 'Скрыт';
            if(user.first_name) {
                document.getElementById('user-avatar').innerText = user.first_name.charAt(0);
            }
        }

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            element.classList.add('active');
        }

        function downloadMod(modId) {
            tg.sendData(modId); 
            tg.close(); 
        }
    </script>
</body>
</html>
